<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Envio Confirmado</title>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f4f4f4; }
        .container { width: 90%; max-width: 600px; margin: 20px auto; background-color: #ffffff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { background-color: #007bff; color: #ffffff; padding: 30px; text-align: center; border-radius: 8px 8px 0 0; }
        .header h1 { margin: 0; font-size: 28px; }
        .content { padding: 40px; }
        .content p { font-size: 16px; line-height: 1.6; color: #333; }
        .details { background-color: #f9f9f9; border-radius: 8px; padding: 20px; margin-top: 20px; }
        .details strong { color: #000; }
        .footer { padding: 30px; text-align: center; color: #888; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Envio Confirmado</h1>
        </div>
        <div class="content">
            <p>Olá, <strong th:text="${nomeProfessor}">Professor</strong>,</p>
            <p>Seu envio de moedas foi realizado com sucesso. Aqui estão os detalhes:</p>
            
            <div class="details">
                <p><strong>Aluno:</strong> <span th:text="${nomeAluno}">Nome do Aluno</span></p>
                <p><strong>Quantidade:</strong> <span th:text="${quantidade}">100</span> moedas</p>
                <p><strong>Motivo:</strong> <span th:text="${motivo}">Motivo aqui...</span></p>
            </div>
            
            <p style="margin-top: 30px;">Obrigado por incentivar seus alunos!<br>Equipe S.G.M.E</p>
        </div>
        <div class="footer">
            &copy; 2025 S.G.M.E. Todos os direitos reservados.
        </div>
    </div>
</body>
</html>
