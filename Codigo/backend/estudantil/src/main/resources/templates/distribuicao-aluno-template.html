<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Você Recebeu Moedas!</title>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f4f4f4; }
        .container { width: 90%; max-width: 600px; margin: 20px auto; background-color: #ffffff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { background-color: #28a745; color: #ffffff; padding: 30px; text-align: center; border-radius: 8px 8px 0 0; }
        .header h1 { margin: 0; font-size: 28px; }
        .content { padding: 40px; }
        .content p { font-size: 16px; line-height: 1.6; color: #333; }
        .details { background-color: #f9f9f9; border-radius: 8px; padding: 20px; margin-top: 20px; }
        .details strong { color: #000; }
        .amount { font-size: 32px; font-weight: bold; color: #28a745; text-align: center; margin: 20px 0; }
        .footer { padding: 30px; text-align: center; color: #888; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Parabéns!</h1>
        </div>
        <div class="content">
            <p>Olá, <strong th:text="${nomeAluno}">Aluno</strong>!</p>
            <p>Você acabou de receber moedas de reconhecimento do(a) <strong th:text="${nomeProfessor}">Professor(a)</strong>.</p>
            
            <div class="amount">
                + <span th:text="${quantidade}">100</span> Moedas
            </div>

            <div class="details">
                <p><strong>Motivo do Reconhecimento:</strong></p>
                <p style="font-style: italic;" th:text="${motivo}">Motivo aqui...</p>
            </div>
            
            <p style="margin-top: 30px;">Continue assim!<br>Equipe S.G.M.E</p>
        </div>
        <div class="footer">
            &copy; 2025 S.G.M.E. Todos os direitos reservados.
        </div>
    </div>
</body>
</html>
